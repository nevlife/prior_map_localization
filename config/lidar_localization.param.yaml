/**:
  ros__parameters:
    registration_method: NDT_OMP
    ndt_num_threads: 8
    voxel_leaf_size: 0.4
    scan_max_range: 80.0
    scan_min_range: 1.5
    use_pcd_map: true
    # use_odom is not a scan seed in lidar_localization_ros2; the seed comes from a twist.
    use_twist_prediction: true
    use_imu_preintegration: false
    # A new scan replaces one still in fragments when the reader keeps only one.
    cloud_queue_depth: 5
    # Large clouds over best-effort DDS lose the whole message on one lost fragment.
    qos_overrides:
      /velodyne_points:
        subscription:
          reliability: reliable
